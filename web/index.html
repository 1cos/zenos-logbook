<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zeno's Logbook</title>
<meta name="theme-color" content="#f7f9f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zeno's Logbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

/* Zeno's Logbook 1.0 — layout: a binder on white. Topic tabs in two rows of frosted-glass pills; the open topic is one large glass sheet.
   Colors: Zeno's on the Square green (#8dc740, the website's "Book a table" color) as the only accent, on white with soft green light behind the glass.
   Single light theme on purpose (Max: white interface). */
:root{
  color-scheme:light;
  --bg:#f7f9f5; --ink:#1d2419; --muted:#6a7465; --line:rgba(29,36,25,.09);
  --green:#8dc740; --green-deep:#4d7a1c; --green-soft:rgba(141,199,64,.16);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.9);
  --blur:saturate(180%) blur(22px);
  --shadow:0 1px 1px rgba(29,36,25,.04),0 8px 28px rgba(60,90,30,.10);
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(40% 32% at 12% 8%,rgba(141,199,64,.30),transparent 70%),radial-gradient(38% 30% at 92% 30%,rgba(181,140,103,.16),transparent 70%),radial-gradient(45% 35% at 30% 95%,rgba(141,199,64,.20),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--green-deep);outline-offset:2px}
.glass,.ear,.sheet,.chip,.secondary,.pane{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top h1{font-family:var(--f-disp);font-size:28px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1;display:flex;align-items:center;gap:9px}
.top h1::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.chip{border:1px solid var(--glass-edge);background:var(--glass);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.note{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.linkbtn{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;color:var(--green-deep)}
/* topic tabs: two rows of glass pills */
.ears{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:12px}
.ear{border:1px solid var(--glass-edge);background:var(--glass);border-radius:16px;padding:11px 6px;font-weight:600;font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center;justify-content:center;text-align:center;min-width:0;line-height:1.2;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);transition:background .15s,color .15s,transform .1s}
.ear:active{transform:scale(.97)}
.ear .n{font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
.ear[aria-selected="true"]{background:linear-gradient(180deg,rgba(141,199,64,.30),rgba(141,199,64,.18));color:var(--ink);border-color:rgba(141,199,64,.55);box-shadow:0 6px 20px rgba(110,160,40,.22),inset 0 1px 0 rgba(255,255,255,.8)}
.ear.add{background:rgba(255,255,255,.35);border-style:dashed;border-color:rgba(29,36,25,.18);box-shadow:none}
/* the sheet */
.sheet{background:var(--glass);border:1px solid var(--glass-edge);border-radius:24px;padding:20px 18px 22px;min-height:60vh;display:grid;gap:14px;align-content:start;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.shead h2{font-family:var(--f-disp);font-size:30px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
.shead small{display:block;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);font-weight:500;margin-top:5px}
.primary{background:linear-gradient(180deg,#9fd457,var(--green));color:#17200f;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:11px 18px;font-weight:700;box-shadow:0 6px 18px rgba(110,160,40,.30),inset 0 1px 0 rgba(255,255,255,.55)}
.primary:disabled{opacity:.45;box-shadow:none}
.secondary{background:var(--glass);border:1px solid var(--glass-edge);border-radius:14px;padding:11px 14px;font-weight:600;box-shadow:var(--shadow)}
.search{width:100%;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7)}
.daygrp{display:grid;gap:0}
.dayh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--green-deep);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.row .b{min-width:0;display:grid;gap:4px}
.row .txt{overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted)}
.thumb{width:100%;max-height:160px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
/* overlay */
.scrim{position:fixed;inset:0;background:rgba(29,36,25,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.pane{background:rgba(255,255,255,.95);border:1px solid var(--glass-edge);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:0 -10px 40px rgba(29,36,25,.12)}
.pane h3{margin:0;font-family:var(--f-disp);text-transform:uppercase;font-size:22px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:rgba(29,36,25,.06);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);padding:0}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
textarea,.field{width:100%;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.8);padding:12px 14px}
textarea{min-height:100px;resize:vertical}
.file{display:flex;align-items:center;gap:8px;border:1px dashed rgba(29,36,25,.2);border-radius:16px;padding:12px 14px;color:var(--muted);font-weight:600;font-size:14px;background:rgba(255,255,255,.5)}
.file input{display:none}
.big{font-size:17px;overflow-wrap:anywhere}
.comments{display:grid;gap:10px}
.cm{border-left:2px solid var(--green);padding-left:12px}
.cm small{display:block;color:var(--muted);font-size:12px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:rgba(29,36,25,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;font-size:14px}
@media (prefers-reduced-motion:no-preference){.pane{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* sign in */
.login{max-width:420px;margin:8vh auto 0;display:grid;gap:16px;background:var(--glass);border:1px solid var(--glass-edge);border-radius:28px;padding:24px 20px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.login h2{font-family:var(--f-disp);text-transform:uppercase;font-size:24px;margin:0;letter-spacing:.02em}
.login p{margin:0;color:var(--muted);font-size:14px}
.dots{display:flex;justify-content:center;gap:14px;padding:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--green-deep)}
.dots i.on{background:var(--green-deep)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{background:var(--glass-strong);border:1px solid var(--glass-edge);border-radius:18px;padding:16px 0;font-size:22px;font-weight:600;box-shadow:var(--shadow)}
.pad button:active{background:var(--green-soft)}
.err{color:#b42318;font-size:14px;text-align:center;min-height:20px;margin:0}
.loading{color:var(--muted);text-align:center;padding:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Zeno's Logbook</h1><button class="chip" id="whoBtn" hidden></button></div>
  <div id="app"><div class="loading">Loading…</div></div>
</div>
<div id="layer"></div>
<script>
/* Zeno's Logbook — talks only to its own server function. No database key lives in this app. */
const API="https://ydqmumpytgrlceuinoqt.supabase.co/functions/v1/zenos-logbook-api?forceFunctionRegion=us-west-2";
const TK="zenos_logbook_token";
let S=null, tab="daily", q="", busy=false;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const hm=iso=>new Date(iso).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
const dayOf=iso=>{const d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function dayName(k){const today=dayOf(new Date().toISOString());const y=new Date();y.setDate(y.getDate()-1);
  const s=new Date(k+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  return k===today?"Today · "+s:k===dayOf(y.toISOString())?"Yesterday · "+s:s}
const money=n=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){const el=document.createElement("div");el.className="toast";el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function token(){try{return localStorage.getItem(TK)||""}catch(e){return ""}}
function setToken(t){try{t?localStorage.setItem(TK,t):localStorage.removeItem(TK)}catch(e){}}
async function call(op,data={}){
  const h={"Content-Type":"application/json"};const t=token();if(t)h.Authorization="Bearer "+t;
  let r;try{r=await fetch(API,{method:"POST",headers:h,body:JSON.stringify({op,...data})})}catch(e){throw new Error("offline")}
  const j=await r.json().catch(()=>({}));
  if(r.status===401){setToken("");S=null;showLogin();throw new Error("signed_out")}
  if(!r.ok)throw new Error(j.error||"server");
  return j;
}
const topic=k=>S.topics.find(t=>t.id===k);

/* ---------- sign in ---------- */
async function showLogin(){
  document.getElementById("whoBtn").hidden=true;closePane();
  const A=document.getElementById("app");A.innerHTML=`<div class="loading">Loading…</div>`;
  let people=[],firstTime=[];try{const r=await call("people");people=r.people;firstTime=r.firstTime||[]}catch(e){A.innerHTML=`<div class="login"><p>No connection. Check the internet and try again.</p><button class="primary" onclick="showLogin()">Try again</button></div>`;return}
  let who=null,pin="";
  const draw=(err="")=>{A.innerHTML=who?`<div class="login"><h2>Hi ${esc(who)}</h2><p>Enter your 4-digit PIN.</p>
      <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<pin.length?"on":""}"></i>`).join("")}</div><p class="err">${err}</p>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button data-back="1" aria-label="Back">‹</button><button data-n="0">0</button><button data-del="1" aria-label="Delete">⌫</button></div></div>`
    :`<div class="login"><h2>Who are you?</h2><div class="people">${people.map(p=>`<button class="secondary" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div></div>`;
    A.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{if(firstTime.includes(b.dataset.p))return firstPin(b.dataset.p);who=b.dataset.p;pin="";draw()});
    A.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(pin.length<4){pin+=b.dataset.n;draw();if(pin.length===4)go()}});
    const d=A.querySelector("[data-del]");if(d)d.onclick=()=>{pin=pin.slice(0,-1);draw()};
    const bk=A.querySelector("[data-back]");if(bk)bk.onclick=()=>{who=null;pin="";draw()};
  };
  const go=async()=>{try{const r=await call("login",{name:who,pin});
      if(r.ok){setToken(r.token);const had=pin;pin="";if(r.choosePin)return choosePin(had,true);await load()}else{pin="";draw(r.locked?"Too many tries. Wait 15 minutes.":"Wrong PIN. Try again.")}}
    catch(e){pin="";draw("No connection. Try again.")}};
  draw();
}

/* ---------- first sign-in: create your PIN right away (1.2) ---------- */
function firstPin(name){
  const A=document.getElementById("app");
  let step="new",neu="",pin="";
  const title={new:`Hi ${esc(name)}`,again:"Type it again"};
  const sub={new:"First time here: choose your own 4-digit PIN. Pick digits only you know.",again:"To be sure it is right."};
  const draw=(err="")=>{A.innerHTML=`<div class="login"><h2>${title[step]}</h2><p>${sub[step]}</p>
      <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<pin.length?"on":""}"></i>`).join("")}</div><p class="err">${err}</p>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button data-back="1" aria-label="Back">‹</button><button data-n="0">0</button><button data-del="1" aria-label="Delete">⌫</button></div></div>`;
    A.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(pin.length<4){pin+=b.dataset.n;draw();if(pin.length===4)next()}});
    A.querySelector("[data-del]").onclick=()=>{pin=pin.slice(0,-1);draw()};
    A.querySelector("[data-back]").onclick=()=>showLogin();
  };
  const weak=p=>/^(\d)\1{3}$/.test(p)||[1,-1].some(k=>[1,2,3].every(i=>p[i]-p[i-1]===k));
  const next=async()=>{
    if(step==="new"){if(weak(pin)){pin="";return draw("Too easy to guess. Try different digits.")}
      neu=pin;pin="";step="again";return draw()}
    if(pin!==neu){pin="";neu="";step="new";return draw("The two PINs were different. Start again.")}
    pin="";
    try{const r=await call("claim_pin",{name,pin:neu});setToken(r.token);toast("Your PIN is saved");await load()}
    catch(e){neu="";step="new";
      if(e.message==="pin_already_chosen"){A.innerHTML=`<div class="login"><h2>${esc(name)} already has a PIN</h2><p>Sign in with it. If it was not you, tell Max.</p><button class="primary" id="okb">OK</button></div>`;document.getElementById("okb").onclick=()=>showLogin();return}
      draw(e.message==="offline"?"No connection. Try again.":"Could not save. Try again.")}
  };
  draw();
}

/* ---------- choose your own PIN ---------- */
function choosePin(current,first){
  closePane();document.getElementById("whoBtn").hidden=true;
  const A=document.getElementById("app");
  let step=current?"new":"current",cur=current||"",neu="",pin="";
  const title={current:"Enter your current PIN",new:first?"Choose your own PIN":"Choose a new PIN",again:"Type it again"};
  const sub={current:"The 4 digits you use now.",new:first?"The PIN you received works only this once. Pick 4 digits only you know.":"Pick 4 digits only you know.",again:"To be sure it is right."};
  const draw=(err="")=>{A.innerHTML=`<div class="login"><h2>${title[step]}</h2><p>${sub[step]}</p>
      <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<pin.length?"on":""}"></i>`).join("")}</div><p class="err">${err}</p>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button data-back="1" aria-label="Back">${first?"":"‹"}</button><button data-n="0">0</button><button data-del="1" aria-label="Delete">⌫</button></div></div>`;
    A.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(pin.length<4){pin+=b.dataset.n;draw();if(pin.length===4)next()}});
    A.querySelector("[data-del]").onclick=()=>{pin=pin.slice(0,-1);draw()};
    A.querySelector("[data-back]").onclick=()=>{if(!first)load()};
  };
  const weak=p=>/^(\d)\1{3}$/.test(p)||[1,-1].some(k=>[1,2,3].every(i=>p[i]-p[i-1]===k));
  const next=async()=>{
    if(step==="current"){cur=pin;pin="";step="new";return draw()}
    if(step==="new"){if(weak(pin)){pin="";return draw("Too easy to guess. Try different digits.")}
      if(pin===cur){pin="";return draw("Pick a PIN different from the old one.")}
      neu=pin;pin="";step="again";return draw()}
    if(pin!==neu){pin="";neu="";step="new";return draw("The two PINs were different. Start again.")}
    pin="";
    try{await call("set_pin",{current:cur,pin:neu});toast("Your PIN is saved");await load()}
    catch(e){const m=e.message;if(m==="signed_out")return;
      if(m==="pin_current"){step="current";cur="";neu="";return draw("The current PIN was wrong.")}
      if(m==="locked"){step=current?"new":"current";return draw("Too many tries. Wait 15 minutes.")}
      step="new";neu="";draw(m==="offline"?"No connection. Try again.":"Could not save. Try again.")}
  };
  draw();
}

/* ---------- data ---------- */
async function load(quiet){
  if(busy)return;busy=true;
  try{const st=await call("state");if(st.choosePin){S=null;busy=false;return choosePin("",true)}S=st;if(!topic(tab))tab=S.topics[0]?.id;render()}
  catch(e){if(e.message==="offline"){if(!S)document.getElementById("app").innerHTML=`<div class="login"><p>No connection. Check the internet and try again.</p><button class="primary" onclick="load()">Try again</button></div>`;else if(!quiet)toast("No connection")}}
  finally{busy=false}
}

function render(){
  if(!S)return;
  const W=document.getElementById("whoBtn");W.hidden=false;W.textContent=S.me;
  const T=topic(tab), s=q.trim().toLowerCase();
  const list=S.entries.filter(e=>e.topic===tab&&(!s||(e.txt+" "+e.who+" "+e.comments.map(c=>c.txt).join(" ")).toLowerCase().includes(s))).sort((a,b)=>b.at.localeCompare(a.at));
  const groups={};list.forEach(e=>(groups[dayOf(e.at)]=groups[dayOf(e.at)]||[]).push(e));
  document.getElementById("app").innerHTML=`<nav class="ears" role="tablist">${S.topics.map(t=>{const n=S.entries.filter(e=>e.topic===t.id).length;
      return `<button class="ear" role="tab" data-k="${esc(t.id)}" aria-selected="${t.id===tab}">${esc(t.name)}<span class="n">${n||""}</span></button>`}).join("")}<button class="ear add" id="addTopic">+ Topic</button></nav>
    <section class="sheet">
    <div class="shead"><h2>${esc(T.name)}<small>${esc(T.hint||"")}</small></h2><button class="primary" id="addBtn">+ Add entry</button></div>
    <input class="search" id="q" type="search" placeholder="Search ${esc(T.name.toLowerCase())}…" value="${esc(q)}">
    ${list.length?Object.keys(groups).map(d=>`<div class="daygrp"><div class="dayh">${dayName(d)}</div>${groups[d].map(e=>`
      <button class="row" data-id="${e.id}"><span class="t">${hm(e.at)}</span><span class="b">
        <span class="txt">${esc(e.txt)}</span>${e.photo?`<img class="thumb" src="${esc(e.photo)}" alt="" loading="lazy">`:""}
        <span class="meta">${esc(e.who)}${e.amount!=null?" · "+money(e.amount):""}${e.comments.length?" · "+e.comments.length+(e.comments.length==1?" comment":" comments"):""}</span></span></button>`).join("")}</div>`).join("")
    :`<div class="empty">${s?"Nothing matches.":"Nothing written in "+esc(T.name)+" yet.<br>Tap “+ Add entry” to write the first one."}</div>`}</section>`;
  const qi=document.getElementById("q");qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
}
function pane(html){document.getElementById("layer").innerHTML=`<div class="scrim" id="scrim"><div class="pane" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim"||e.target.closest(".x"))closePane()})}
function closePane(){document.getElementById("layer").innerHTML=""}
function failMsg(e){return e.message==="offline"?"No connection. Nothing was saved, try again.":e.message==="signed_out"?"Please sign in again.":"Could not save. Try again."}
async function send(btn,op,data,okMsg){btn.disabled=true;const old=btn.textContent;btn.textContent="Saving…";
  try{await call(op,data);toast(okMsg);return true}catch(e){if(e.message!=="signed_out")toast(failMsg(e));btn.disabled=false;btn.textContent=old;return false}}

function addEntry(){const T=topic(tab);let photo=null;
  pane(`<h3>${esc(T.name)}<button class="x" aria-label="Close">×</button></h3>
    <div><div class="lbl">What happened?</div><textarea id="txt" maxlength="4000" placeholder="Write it the way you'd say it."></textarea></div>
    ${T.amount?`<div><div class="lbl">Amount $ (optional)</div><input class="field" id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>`:""}
    <label class="file"><input type="file" id="photo" accept="image/*"><span id="fileT">Add a photo (optional)</span></label>
    <button class="primary" id="save" disabled>Save</button>`);
  const tx=document.getElementById("txt");tx.focus();tx.oninput=()=>document.getElementById("save").disabled=!tx.value.trim();
  document.getElementById("photo").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const s=Math.min(1,1200/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    photo=cv.toDataURL("image/jpeg",.75);document.getElementById("fileT").textContent="Photo added ✓"};img.src=r.result};r.readAsDataURL(f)};
  document.getElementById("save").onclick=async e=>{const a=document.getElementById("amt");
    if(await send(e.target,"add_entry",{topic:tab,text:tx.value.trim(),amount:a&&a.value!==""?a.value:null,photo},"Saved")){closePane();q="";await load()}};
}
function openEntry(eid){const e=S.entries.find(x=>x.id===eid);if(!e)return;
  const when=iso=>new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+hm(iso);
  pane(`<h3>${esc(topic(e.topic).name)}<button class="x" aria-label="Close">×</button></h3>
    <div class="big">${esc(e.txt)}</div>${e.photo?`<img class="thumb" style="max-height:340px" src="${esc(e.photo)}" alt="">`:""}
    <div class="meta">${esc(e.who)} · ${when(e.at)}${e.amount!=null?" · "+money(e.amount):""}</div>
    <div><div class="lbl">Comments</div><div class="comments">${e.comments.length?e.comments.map(c=>`<div class="cm">${esc(c.txt)}<small>${esc(c.who)} · ${when(c.at)}</small></div>`).join(""):`<div class="meta">No comments yet.</div>`}</div></div>
    <textarea id="c" maxlength="2000" style="min-height:70px" placeholder="Add a comment…"></textarea>
    <button class="primary" id="cSave" disabled>Add comment</button>`);
  const c=document.getElementById("c");c.oninput=()=>document.getElementById("cSave").disabled=!c.value.trim();
  document.getElementById("cSave").onclick=async ev=>{if(await send(ev.target,"add_comment",{entry:eid,text:c.value.trim()},"Comment added")){await load();openEntry(eid)}};
}
function addTopic(){pane(`<h3>New topic<button class="x" aria-label="Close">×</button></h3>
    <div><div class="lbl">Name</div><input class="field" id="tn" maxlength="24" placeholder="e.g. Health inspections"></div>
    <p class="meta" style="margin:0">Everyone will see the new topic.</p>
    <button class="primary" id="tSave" disabled>Add topic</button>`);
  const tn=document.getElementById("tn");tn.focus();tn.oninput=()=>document.getElementById("tSave").disabled=!tn.value.trim();
  document.getElementById("tSave").onclick=async ev=>{ev.target.disabled=true;try{const r=await call("add_topic",{name:tn.value.trim()});tab=r.id;q="";closePane();toast("Topic added");await load()}catch(e){if(e.message!=="signed_out")toast(failMsg(e));ev.target.disabled=false}}}
function account(){if(!S)return;pane(`<h3>${esc(S.me)}<button class="x" aria-label="Close">×</button></h3>
    <p class="meta" style="margin:0">Signed in on this phone. Sign out if this phone is shared.</p>
    <button class="secondary" id="chg">Change PIN</button><button class="secondary" id="out">Sign out</button>`);
  document.getElementById("chg").onclick=()=>{S=null;choosePin("",false)};
  document.getElementById("out").onclick=async()=>{closePane();S=null;document.getElementById("whoBtn").hidden=true;document.getElementById("app").innerHTML=`<div class="loading">Signing out…</div>`;try{await call("logout")}catch(e){}setToken("");showLogin()}}
document.addEventListener("click",e=>{
  if(e.target.closest("#layer"))return;
  const ear=e.target.closest(".ear[data-k]");if(ear){tab=ear.dataset.k;q="";render();return}
  if(e.target.closest("#addTopic"))return addTopic();
  if(e.target.closest("#addBtn"))return addEntry();
  const r=e.target.closest(".row");if(r)return openEntry(r.dataset.id);
  if(e.target.id==="whoBtn")return account();
});
/* fresh data when the app comes back on screen, and every 2 minutes while it is open */
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S&&!document.querySelector("#layer .pane"))load(true)});
setInterval(()=>{if(document.visibilityState==="visible"&&S&&!document.querySelector("#layer .pane"))load(true)},120000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
token()?load():showLogin();
</script>
</body>
</html>
